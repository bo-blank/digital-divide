<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <defs>
    <clipPath id="lower-half">
      <polygon points="64,0 64,64 0,64"/>
    </clipPath>
    <path id="d" d="M15 8h14c14 0 23 10 23 24s-9 24-23 24H15V8zm9 8v32h5c10 0 15-7 15-16s-5-16-15-16h-5z" fill-rule="evenodd"/>
  </defs>
  <style>
    .bg { fill: #1A1A1A }
    .divide { stroke: #1A1A1A }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #121212 }
      .divide { stroke: #121212 }
    }
  </style>
  <!-- Background -->
  <rect width="64" height="64" rx="14" class="bg"/>
  <!-- D upper-left half: warm off-white -->
  <use href="#d" fill="#FAFAF8"/>
  <!-- D lower-right half: teal accent -->
  <use href="#d" fill="#0D9488" clip-path="url(#lower-half)"/>
  <!-- The Divide: diagonal gap -->
  <line x1="62" y1="2" x2="2" y2="62" class="divide" stroke-width="3.5"/>
</svg>